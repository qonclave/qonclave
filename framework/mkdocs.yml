site_name: Qonclave
site_description: Privacy-first, autonomous distributed intelligence — framework docs and API reference
repo_url: https://github.com/qonclave/qonclave
repo_name: qonclave/qonclave
edit_uri: edit/main/framework/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [sdk/python/src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

nav:
  - Home: README.md
  - Guides:
      - Developer Guide: DEVELOPER_GUIDE.md
      - Conventions: CONVENTIONS.md
  - Architecture:
      - Architecture: ARCHITECTURE.md
      - Communication: COMMUNICATION.md
      - Placement: PLACEMENT.md
      - Profiles: PROFILES.md
      - Deployment: DEPLOYMENT.md
      - Vision: VISION.md
  - Security: SECURITY.md
  - API Reference:
      - Core: api/core.md
      - Placement: api/placement.md
      - Discovery: api/discovery.md
      - Security: api/security.md
      - Transport: api/transport.md
      - Inference: api/inference.md
      - Hub: api/hub.md
      - Edge: api/edge.md
      - Storage: api/storage.md
      - Archive: api/archive.md
      - Compute: api/compute.md
      - CLI: api/cli.md
