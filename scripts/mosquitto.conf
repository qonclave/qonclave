# mosquitto.conf — minimal local-loopback broker for the Qonclave hackathon demo.
#
# Loopback-only on the default MQTT port; anonymous auth is fine for a local
# demo on a private WiFi network but is NOT safe for any production or
# internet-facing deployment (see hub/README.md's MQTT section).
#
# Run:
#   mosquitto -c scripts/mosquitto.conf -v

listener 1883 127.0.0.1
allow_anonymous true

# No persistence needed for a demo; events aren't expected to survive a
# broker restart.
persistence false

log_type error
log_type warning
log_type notice
