<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qonclave Hub — Reason Test</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --fg:#e6e8ec; --muted:#8b93a1;
          --accent:#4f9dff; --ok:#3ecf8e; --err:#ff6b6b; --border:#2a2e37; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  .wrap { max-width:880px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--border);
          border-radius:12px; padding:20px; margin-bottom:18px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input[type=file], textarea {
    width:100%; background:#0f1218; color:var(--fg); border:1px solid var(--border);
    border-radius:8px; padding:10px; font-size:14px; font-family:inherit; }
  textarea { resize:vertical; min-height:60px; }
  .row { display:flex; gap:12px; align-items:center; margin-top:14px; flex-wrap:wrap; }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px;
           padding:11px 20px; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .pill { font-size:12px; padding:3px 10px; border-radius:999px; border:1px solid var(--border); }
  .pill.ok { color:var(--ok); border-color:var(--ok); }
  .pill.err { color:var(--err); border-color:var(--err); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:640px){ .grid{ grid-template-columns:1fr; } }
  img#preview { max-width:100%; border-radius:8px; border:1px solid var(--border);
                display:none; }
  pre { white-space:pre-wrap; word-break:break-word; margin:0; font-size:14px;
        line-height:1.5; }
  .meta { color:var(--muted); font-size:12px; margin-top:10px; }
  .spinner { display:none; width:16px; height:16px; border:2px solid var(--border);
             border-top-color:var(--accent); border-radius:50%;
             animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  code { background:#0f1218; padding:1px 6px; border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Qonclave Hub — Reason Test</h1>
  <div class="sub">Upload a frame → the hub runs the VLM (Snapdragon only) and returns its reasoning.</div>

  <div class="card">
    <span id="healthPill" class="pill">checking…</span>
    <span class="meta" id="healthMeta"></span>
  </div>

  <div class="card">
    <label for="file">Image</label>
    <input type="file" id="file" accept="image/*" />
    <div style="margin-top:14px;">
      <label for="prompt">Prompt (optional)</label>
      <textarea id="prompt" placeholder="Leave blank to use the hub default…"></textarea>
    </div>
    <div class="row">
      <button id="send" disabled>Send to /reason</button>
      <div class="spinner" id="spin"></div>
      <span id="statusPill"></span>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <label>Preview</label>
      <img id="preview" alt="preview" />
    </div>
    <div class="card">
      <label>Reasoning output</label>
      <pre id="output">—</pre>
      <div class="meta" id="outMeta"></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fileEl = $("file"), promptEl = $("prompt"), sendEl = $("send"),
      spin = $("spin"), out = $("output"), outMeta = $("outMeta"),
      statusPill = $("statusPill"), preview = $("preview");

// --- health check ---
async function checkHealth() {
  try {
    const r = await fetch("/health");
    const j = await r.json();
    const pill = $("healthPill");
    pill.textContent = "hub: ok";
    pill.className = "pill ok";
    const v = j.vlm || {};
    $("healthMeta").textContent =
      ` · VLM ${v.available ? "available" : "unavailable"} (${v.arch}) · ${v.model_id}`
      + (v.load_error ? ` · ${v.load_error}` : "");
  } catch (e) {
    const pill = $("healthPill");
    pill.textContent = "hub: unreachable";
    pill.className = "pill err";
  }
}

// --- preview + enable button ---
fileEl.addEventListener("change", () => {
  const f = fileEl.files[0];
  sendEl.disabled = !f;
  if (f) {
    preview.src = URL.createObjectURL(f);
    preview.style.display = "block";
  }
});

// --- submit ---
sendEl.addEventListener("click", async () => {
  const f = fileEl.files[0];
  if (!f) return;
  sendEl.disabled = true;
  spin.style.display = "inline-block";
  statusPill.textContent = "";
  out.textContent = "…reasoning…";
  outMeta.textContent = "";

  const fd = new FormData();
  fd.append("image", f);
  if (promptEl.value.trim()) fd.append("prompt", promptEl.value.trim());

  const t0 = performance.now();
  try {
    const r = await fetch("/reason", { method: "POST", body: fd });
    const j = await r.json();
    const dt = ((performance.now() - t0) / 1000).toFixed(2);

    if (j.text) {
      out.textContent = j.text;
    } else if (j.available === false) {
      out.textContent = "VLM not available on this hub (non-Snapdragon machine).\n\n"
                        + (j.error || "");
    } else {
      out.textContent = "Error: " + (j.error || "unknown");
    }

    const p = statusPill;
    p.className = "pill " + (j.ok ? "ok" : "err");
    p.textContent = j.ok ? "ok" : "error";

    const parts = [];
    if (j.model_id) parts.push(j.model_id);
    if (j.latency_s != null) parts.push(`server ${j.latency_s}s`);
    parts.push(`round-trip ${dt}s`);
    if (j.image_saved_as) parts.push(j.image_saved_as);
    if (j.profile && j.profile.decode_speed != null)
      parts.push(`${j.profile.decode_speed.toFixed?.(1) ?? j.profile.decode_speed} tok/s`);
    outMeta.textContent = parts.join(" · ");
  } catch (e) {
    out.textContent = "Request failed: " + e;
    statusPill.className = "pill err";
    statusPill.textContent = "failed";
  } finally {
    spin.style.display = "none";
    sendEl.disabled = false;
  }
});

checkHealth();
setInterval(checkHealth, 15000);
</script>
</body>
</html>
