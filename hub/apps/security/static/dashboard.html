<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qonclave Hub — Dashboard</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --fg:#e6e8ec; --muted:#8b93a1;
          --accent:#4f9dff; --ok:#3ecf8e; --err:#ff6b6b; --warn:#f5b74f;
          --border:#2a2e37; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  .wrap { max-width:1040px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--border);
          border-radius:12px; padding:18px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px; }
  @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:8px;
          text-transform:uppercase; letter-spacing:.04em; }
  img#frame { max-width:100%; border-radius:8px; border:1px solid var(--border);
              background:#0f1218; min-height:120px; }
  .big { font-size:28px; font-weight:700; margin:2px 0 12px; }
  .pill { font-size:12px; padding:3px 10px; border-radius:999px;
          border:1px solid var(--border); display:inline-block; }
  .pill.ok { color:var(--ok); border-color:var(--ok); }
  .pill.err { color:var(--err); border-color:var(--err); }
  .pill.warn { color:var(--warn); border-color:var(--warn); }
  .kv { display:flex; justify-content:space-between; padding:6px 0;
        border-bottom:1px solid var(--border); font-size:14px; }
  .kv:last-child { border-bottom:none; }
  .kv span:first-child { color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; }
  td.alert-yes { color:var(--ok); }
  td.alert-no { color:var(--muted); }
  .headrow { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .reason { font-size:13px; color:var(--fg); line-height:1.5; white-space:pre-wrap;
            max-height:120px; overflow:auto; }
  nav { display:flex; gap:14px; margin-bottom:14px; font-size:14px; }
  nav a { color:var(--muted); text-decoration:none; }
  nav a:hover { color:var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="/test/edge">Test →</a>
  </nav>
  <div class="headrow">
    <div>
      <h1>Qonclave Hub — Dashboard</h1>
      <div class="sub">Live view of edge events and hub verification.</div>
    </div>
    <span id="hubPill" class="pill">connecting…</span>
    <span id="vlmPill" class="pill"></span>
  </div>

  <div class="grid">
    <div class="card">
      <label>Latest escalation frame</label>
      <img id="frame" alt="latest frame" />
    </div>
    <div class="card">
      <label>Latest event</label>
      <div class="big" id="alertBig">—</div>
      <div class="kv"><span>Hub verified</span><span id="hubVerified">—</span></div>
      <div class="kv"><span>Edge confidence</span><span id="edgeConf">—</span></div>
      <div class="kv"><span>Hub confidence</span><span id="hubConf">—</span></div>
      <div class="kv"><span>Identity</span><span id="identity">—</span></div>
      <div class="kv"><span>Device</span><span id="device">—</span></div>
      <div class="kv"><span>Event ID</span><span id="eventId">—</span></div>
      <div class="kv"><span>Latency</span><span id="latency">—</span></div>
      <div style="margin-top:12px;">
        <label>Reasoning</label>
        <div class="reason" id="reason">—</div>
      </div>
    </div>
  </div>

  <div class="card">
    <label>Recent events</label>
    <table>
      <thead>
        <tr><th>Time</th><th>Event ID</th><th>Device</th><th>Edge</th>
            <th>Hub</th><th>Verified</th><th>Alert</th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="7" style="color:var(--muted)">No events yet.</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmtConf = (c) => (c == null ? "—" : (typeof c === "number" ? c.toFixed(2) : c));
const shortTime = (iso) => { try { return new Date(iso).toLocaleTimeString(); } catch { return iso || "—"; } };

async function refresh() {
  try {
    const r = await fetch("/user/events");
    const j = await r.json();

    $("hubPill").textContent = "hub: ok";
    $("hubPill").className = "pill ok";
    $("vlmPill").textContent = "VLM " + (j.vlm_available ? "available" : "unavailable");
    $("vlmPill").className = "pill " + (j.vlm_available ? "ok" : "warn");

    // latest frame (cache-bust)
    if (j.latest_frame) {
      $("frame").src = "/user/latest.jpg?ts=" + Date.now();
    }

    const latest = (j.events && j.events[0]) || null;
    if (latest) {
      $("alertBig").textContent = latest.alert || "—";
      const v = latest.hub_verified;
      $("hubVerified").innerHTML = v
        ? '<span class="pill ok">true</span>'
        : '<span class="pill err">false</span>';
      $("edgeConf").textContent = fmtConf(latest.edge_confidence);
      $("hubConf").textContent = fmtConf(latest.hub_confidence);
      $("identity").textContent = latest.identity_status || "—";
      $("device").textContent = latest.device_id || "—";
      $("eventId").textContent = latest.event_id || "—";
      $("latency").textContent = latest.latency_s != null ? latest.latency_s + "s" : "—";
      $("reason").textContent = latest.reasoning_text
        || (latest.reasoning_available === false ? "(reasoning unavailable on this hub)" : "—");
    }

    // table
    const rows = $("rows");
    if (j.events && j.events.length) {
      rows.innerHTML = j.events.map(e => `
        <tr>
          <td>${shortTime(e.received_at)}</td>
          <td>${e.event_id || "—"}</td>
          <td>${e.device_id || "—"}</td>
          <td>${fmtConf(e.edge_confidence)}</td>
          <td>${fmtConf(e.hub_confidence)}</td>
          <td>${e.hub_verified ? '<span class="pill ok">yes</span>' : '<span class="pill err">no</span>'}</td>
          <td class="${e.hub_verified ? 'alert-yes' : 'alert-no'}">${e.alert || "—"}</td>
        </tr>`).join("");
    }
  } catch (e) {
    $("hubPill").textContent = "hub: unreachable";
    $("hubPill").className = "pill err";
  }
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
