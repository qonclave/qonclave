<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Generic Object Detection</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <div>
      <div class="header">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <h1 class="arduino-text">Video Generic Object Detection</h1>
          <div id="hubStatusBadge" class="hub-status offline">
            <span class="status-dot"></span>
            <span id="hubStatusText">Hub Offline (Searching...)</span>
          </div>
        </div>
        <img class="arduino-logo" src="./img/logo.svg" alt="Arduino Logo" />
      </div>

      <div class="main-content">
        <div class="container" id="video-container">
          <div id="videoFeedContainer">
            <div id="videoPlaceholder" class="camera-status">
              <img src="./img/no-face.svg" alt="Searching webcam" />
              <p class="feedback-text">Searching Webcam...</p>
            </div>
            <iframe
              id="dynamicIframe"
              title="Video stream"
              width="1024px"
              height="768px"
              frameborder="0"
              style="display: none"></iframe>
          </div>
        </div>

        <div class="right-column">
          <div class="container container-right">
            <div class="controls-section">
              <div class="control-group">
                <div class="control-confidence">
                  <div style="display: flex; align-items: center; gap: 8px; position: relative">
                    <label id="confidence-label" for="confidenceSlider">Confidence</label>
                    <img src="./img/info.svg" alt="Info" class="info-btn confidence" />
                    <div class="popover"></div>
                  </div>
                  <button id="confidenceResetButton" class="btn-tertiary">
                    <input
                      type="number"
                      id="confidenceInput"
                      class="confidence-input"
                      min="0"
                      max="1"
                      step="0.05"
                      value="0.50" />
                    <img src="img/icon-reset.svg" alt="Reset" class="reset-icon" />
                  </button>
                </div>
                <div class="slider-box">
                  <span class="confidence-limits">0</span>
                  <div class="slider-container">
                    <div class="slider-progress" id="sliderProgress"></div>
                    <div class="confidence-value-display" id="confidenceValueDisplay">0.5</div>
                    <input type="range" id="confidenceSlider" min="0" max="1" step="0.01" value="0.5" />
                  </div>
                  <span class="confidence-limits">1</span>
                </div>
              </div>
            </div>
          </div>

          <div class="container container-right feedback-panel">
            <div id="feedback-section" class="feedback-section">
              <div style="display: flex; align-items: center; gap: 8px; position: relative">
                <h2 class="recent-scans-title" style="margin: 0">Feedback</h2>
                <img src="./img/info.svg" alt="Info" class="info-btn feedback" />
                <div class="popover"></div>
              </div>
              <div id="feedback-content" class="feedback-content">
                <img src="img/stars.svg" alt="Stars" />
                <p class="feedback-text">System response will appear here</p>
              </div>
            </div>
          </div>

          <div class="container container-right">
            <section class="robot-console" aria-labelledby="robot-console-title">
              <div class="robot-console-header">
                <h2 id="robot-console-title" class="recent-scans-title">Robot control</h2>
                <label for="robotMagnitude">
                  Duration / angle
                  <input id="robotMagnitude" type="number" min="1" max="360" step="1" value="1" />
                  sec / °
                </label>
              </div>
              <div class="robot-dpad" aria-label="Robot direction controls">
                <button type="button" class="robot-move forward" data-direction="FORWARD" aria-label="Move forward">▲</button>
                <button type="button" class="robot-move left" data-direction="LEFT" aria-label="Turn left">◀</button>
                <button type="button" id="robotStop" class="robot-stop" aria-label="Stop robot">STOP</button>
                <button type="button" class="robot-move right" data-direction="RIGHT" aria-label="Turn right">▶</button>
                <button type="button" class="robot-move backward" data-direction="BACKWARD" aria-label="Move backward">▼</button>
              </div>
              <p id="robotStatus" class="robot-status" role="status" aria-live="polite">Ready</p>
            </section>
          </div>

          <div class="container container-right">
            <section class="buzzer-console" aria-labelledby="buzzer-console-title">
              <div class="robot-console-header">
                <h2 id="buzzer-console-title" class="recent-scans-title">Modulino Buzzer control</h2>
              </div>
              <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px;">
                <div style="display: flex; gap: 8px; align-items: center;">
                  <label for="edgeBuzzerFreq" style="font-size: 12px; color: #8b93a1;">Freq (Hz):</label>
                  <input id="edgeBuzzerFreq" type="number" min="20" max="20000" step="10" value="440" style="width: 70px; padding: 4px 6px; background: #0f1218; color: #e6e8ec; border: 1px solid #2a2e37; border-radius: 4px; font-size: 12px;" />
                  <label for="edgeBuzzerDur" style="font-size: 12px; color: #8b93a1;">Dur (ms):</label>
                  <input id="edgeBuzzerDur" type="number" min="0" max="60000" step="100" value="0" style="width: 70px; padding: 4px 6px; background: #0f1218; color: #e6e8ec; border: 1px solid #2a2e37; border-radius: 4px; font-size: 12px;" />
                </div>
                <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                  <button type="button" id="btnEdgeBuzzerBeliever" style="flex: 1; padding: 8px; font-weight: bold; font-size: 12px; background: linear-gradient(135deg, #4f9dff, #9b51e0); color: #ffffff; border: none; border-radius: 6px; cursor: pointer;">🎵 "BELIEVER"</button>
                  <button type="button" id="btnEdgeBuzzerTone" style="flex: 1; padding: 8px; font-weight: bold; font-size: 12px; background: linear-gradient(135deg, #f5b74f, #ff6b6b); color: #0f1115; border: none; border-radius: 6px; cursor: pointer;">▶ TONE</button>
                  <button type="button" id="btnEdgeBuzzerStop" style="padding: 8px 12px; font-weight: bold; font-size: 12px; background: #242833; color: #ff6b6b; border: 1px solid #ff6b6b; border-radius: 6px; cursor: pointer;">⏹ STOP</button>
                </div>
                <p id="edgeBuzzerStatus" class="robot-status" role="status" aria-live="polite">Ready</p>
              </div>
            </section>
          </div>

          <div class="container container-right">
            <div class="feedback-section">
              <div style="display: flex; align-items: center; justify-content: space-between;">
                <h2 class="recent-scans-title" style="margin: 0">12x8 LED Matrix Display</h2>
                <span id="ledArrayText" style="font-size: 13px; font-weight: bold; color: #3ecf8e; text-transform: uppercase;">CLEAR (Safe)</span>
              </div>
              <div id="virtualMatrixGrid" style="display: grid; grid-template-columns: repeat(12, 14px); gap: 4px; background: #0a0c10; padding: 12px; border-radius: 8px; border: 1px solid #222; justify-content: center; margin-top: 12px;"></div>
            </div>
          </div>

          <div class="container container-right">
            <div class="recent-detections-section">
              <div class="recent-scans-title-container">
                <h2 class="recent-scans-title">Recent detections</h2>
              </div>
              <p id="followStatus" class="robot-status" role="status" aria-live="polite">No target</p>
              <ul id="recentDetections"></ul>
            </div>
          </div>
        </div>
      </div>
      <div id="error-container" class="error-message" style="display: none"></div>
    </div>

    <script>
      const iframe = document.getElementById('dynamicIframe');
      const placeholder = document.getElementById('videoPlaceholder');
      const streamUrl = `${window.location.origin}/camera-preview`;

      let intervalId;

      iframe.onload = () => {
        if (intervalId) {
          clearInterval(intervalId);
        }
        placeholder.style.display = 'none';
        iframe.style.display = 'block';
      };

      const startLoading = () => {
        // Set the src to start loading
        iframe.src = streamUrl;
      };

      intervalId = setInterval(startLoading, 1000); // Try to load every second
    </script>

    <script src="libs/socket.io.min.js"></script>
    <script src="libs/arduino.js"></script>
    <script src="app.js"></script>
  </body>
</html>
